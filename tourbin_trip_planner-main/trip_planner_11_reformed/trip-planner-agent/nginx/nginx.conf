server {
    listen 80;
    server_name tourbin.ai www.tourbin.ai;

    client_max_body_size 20m;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Pass along the real client info and original host.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The CDN terminates TLS and talks to us over plain HTTP, but the
        # browser<->CDN leg is HTTPS. Telling the backend "https" here is
        # what lets it generate correct URLs / cookies / redirects for the
        # protocol the user actually sees.
        proxy_set_header X-Forwarded-Proto https;

        # Needed if the app ever uses WebSockets (harmless to leave in if not).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: tourbin-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      # The default transaction memory cap (~685 MiB) is too small for the
      # nearby-destinations radius query over ~9,000 destinations. This
      # removes that artificial cap so the transaction can use up to the
      # configured heap instead.
      NEO4J_dbms_memory_transaction_total_max: "0"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    # Not published to the host on purpose -- only the backend container
    # needs to reach Neo4j, over the internal "tourbin-net" network below.
    # Uncomment ONE of these if you want to browse Neo4j yourself, but keep
    # it bound to 127.0.0.1 so it's not reachable from the public internet:
    # ports:
    #   - "127.0.0.1:7474:7474"
    #   - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - tourbin-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tourbin-backend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    # Loads your ENTIRE real .env file into the container as-is (same
    # variable names you already use locally: NEO4J_USER, AVALAI_API_KEY,
    # OPENAI_API_KEY, ELASTIC_*, etc. -- config.py already understands them).
    env_file:
      - ./.env
    # The only line that MUST differ from your local .env: inside Docker,
    # "localhost" means "this container", not the neo4j container. This
    # override wins over whatever NEO4J_URI is set to in .env.
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
    # No longer published to the public internet. Only nginx (below) talks
    # to backend now, over the internal network by container name. Bound
    # to 127.0.0.1 so you can still `curl localhost:8000` FROM the server
    # itself for debugging, without it being reachable from outside.
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - tourbin-net

  nginx:
    image: nginx:1.27-alpine
    container_name: tourbin-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # This is the ONE port your CDN's origin setting should point at now.
    ports:
      - "80:80"
    networks:
      - tourbin-net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  tourbin-net:
    driver: bridge

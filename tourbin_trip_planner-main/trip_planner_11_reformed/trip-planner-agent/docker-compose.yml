services:
  neo4j:
    image: neo4j:5.26-community
    container_name: tourbin-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    # Not published to the host on purpose -- only the backend container
    # needs to reach Neo4j, over the internal "tourbin-net" network below.
    # Uncomment ONE of these if you want to browse Neo4j yourself, but keep
    # it bound to 127.0.0.1 so it's not reachable from the public internet:
    # ports:
    #   - "127.0.0.1:7474:7474"
    #   - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - tourbin-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tourbin-backend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_DATABASE: "neo4j"
      LLM_MODEL: "${LLM_MODEL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_BASE_URL: "${LLM_BASE_URL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL}"
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "false"
      CORS_ORIGINS: "${CORS_ORIGINS}"
    ports:
      - "8000:8000"
    networks:
      - tourbin-net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  tourbin-net:
    driver: bridge
